<!doctype html><html><head><meta charset="utf-8"><title>Film Tagger</title><link rel="icon" href="/static/favicon.ico"><link rel="apple-touch-icon" href="/static/logo-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#121417;--p:#1b1e23;--p2:#252930;--b:#333944;--t:#e6e8eb;--m:#8b93a1;--a:#5b9cff;--ai:#c58bff;--ok:#3fbf7f;--bad:#ef5b5b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.4 system-ui,Segoe UI,sans-serif;display:flex;height:100vh;overflow:hidden}
button,input,select,textarea{font:inherit;color:var(--t);background:var(--p2);border:1px solid var(--b);border-radius:6px;padding:5px 8px}
button{cursor:pointer}button:hover{border-color:var(--a)}button.pri{background:var(--a);border-color:var(--a);color:#fff}
#side{width:290px;background:var(--p);border-right:1px solid var(--b);padding:12px;overflow:auto;flex-shrink:0}
#side h3{margin:14px 0 6px;font-size:12px;text-transform:uppercase;color:var(--m);letter-spacing:.05em}
#side label{display:block;font-size:12px;color:var(--m);margin-top:6px}#side input,#side select{width:100%}
.row{display:flex;gap:6px}.row>*{flex:1;min-width:0}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#bar{display:flex;gap:8px;align-items:center;padding:10px;border-bottom:1px solid var(--b);background:var(--p);flex-wrap:wrap}
#q{flex:1;min-width:200px}#count{color:var(--m)}
#bulk{display:none;gap:6px;padding:8px 10px;background:#1d2a40;border-bottom:1px solid var(--b);align-items:center;flex-wrap:wrap}
#content{flex:1;overflow:auto;padding:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{background:var(--p);border:2px solid transparent;border-radius:8px;overflow:hidden;cursor:pointer;position:relative}
.card.sel{border-color:var(--a)}.card{position:relative}.card .cb{position:absolute;top:6px;left:6px;z-index:2;width:18px;height:18px;margin:0;cursor:pointer;opacity:.35}.card:hover .cb,.card.sel .cb{opacity:1}.card .po{aspect-ratio:2/3;background:var(--p2);display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;color:var(--m);font-size:15px}
.card img{width:100%;height:100%;object-fit:cover}.card .ti{padding:6px 8px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .su{padding:0 8px 6px;font-size:11px;color:var(--m)}.badge{position:absolute;top:6px;font-size:10px;padding:2px 5px;border-radius:4px}
.b-ai{right:6px;background:var(--ai);color:#000}.b-q{left:6px;background:#e0b341;color:#000}.b-miss{left:6px;top:26px;background:var(--bad)}
.b-w{right:6px;top:26px;background:var(--ok);color:#000}
table{border-collapse:collapse;width:100%}th,td{padding:6px 8px;border-bottom:1px solid var(--b);text-align:left;vertical-align:top}
th{position:sticky;top:-12px;background:var(--p);cursor:pointer;user-select:none;color:var(--m)}tr.sel td{background:#1d2a40}tbody tr:hover td{background:var(--p2)}
.tag{display:inline-block;background:var(--p2);border:1px solid var(--b);border-radius:12px;padding:1px 8px;margin:2px;font-size:12px}
.tag .c{color:var(--m);font-size:10px;margin-right:3px}.tag.ai{border-color:var(--ai);color:var(--ai)}.tag x{cursor:pointer;margin-left:4px;color:var(--m)}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-start;justify-content:center;overflow:auto;z-index:10;padding:30px}
#mbox{position:relative;background:var(--p);border:1px solid var(--b);border-radius:10px;width:min(900px,96vw);padding:18px}
#mbox label{display:block;font-size:12px;color:var(--m);margin:8px 0 2px}#mbox input,#mbox textarea,#mbox select{width:100%}
.fg{display:grid;grid-template-columns:200px 1fr;gap:16px}.fg img{width:100%;border-radius:6px}
.mclose{position:absolute;top:8px;right:10px;width:32px;height:32px;padding:0;font-size:22px;line-height:1;border-radius:50%;background:transparent;border:1px solid transparent;color:var(--m);z-index:2}.mclose:hover{color:var(--t);border-color:var(--b);background:var(--p2)}
#jobbar{display:none;align-items:center;gap:10px;padding:5px 10px;background:#17202e;border-bottom:1px solid var(--b);font-size:12px}
#jobbar .track{flex:0 0 260px;height:8px;background:var(--p2);border-radius:4px;overflow:hidden}#jobbar .fill{height:100%;width:0;background:var(--a);transition:width .4s}
#jobbar.done .fill{background:var(--ok)}#jobbar.err .fill{background:var(--bad)}#jobbar button{padding:1px 8px;font-size:12px}
.mp{display:inline-block;border:1px solid var(--m);border-radius:3px;padding:0 4px;font-size:10px;color:var(--t);margin-left:3px}
.chip{display:inline-block;border:1px solid var(--b);border-radius:12px;padding:1px 8px;margin:2px;font-size:12px;cursor:pointer;user-select:none}.chip.on{background:var(--a);border-color:var(--a);color:#fff}
#libBtn{max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#libPop{display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:15;width:380px;max-height:70vh;background:var(--p);border:1px solid var(--b);border-radius:8px;box-shadow:0 8px 24px #000a;flex-direction:column}
#libPop.open{display:flex}#libSearch{margin:8px;width:calc(100% - 16px)}#libTree{overflow:auto;padding:0 4px 6px}
.lr{display:flex;align-items:center;gap:4px;padding:3px 6px;border-radius:4px;cursor:pointer;white-space:nowrap}.lr:hover{background:var(--p2)}.lr.cur{background:#1d2a40;color:#fff}
.lr .ar{width:18px;text-align:center;color:var(--m);flex:0 0 18px}.lr .ar:hover{color:var(--t)}.lr .nm{flex:1;overflow:hidden;text-overflow:ellipsis}.lr .n{color:var(--m);font-size:11px}.lr.sub{padding-left:28px}
#ctx{position:fixed;display:none;background:var(--p2);border:1px solid var(--b);border-radius:6px;z-index:20;min-width:220px;padding:4px}
#ctx div{padding:6px 10px;cursor:pointer;border-radius:4px}#ctx div:hover{background:var(--a)}
#toast{position:fixed;bottom:16px;right:16px;background:var(--p2);border:1px solid var(--a);padding:10px 14px;border-radius:8px;display:none;z-index:30;max-width:400px}
.muted{color:var(--m);font-size:12px}.ss{display:flex;justify-content:space-between;padding:3px 0}.ss a{color:var(--a);cursor:pointer}
.pend{border:1px solid var(--ai);border-radius:8px;padding:8px;margin:8px 0}
.tagcloud .tag{cursor:pointer}
.plinks a,#personHdr a,a.clink{color:#d4d4d4;text-decoration:none;border-bottom:1px dotted #888}.plinks a:hover,#personHdr a:hover{color:#fff;border-bottom-color:#fff}
.tlink{color:inherit;text-decoration:none}.tlink:hover{text-decoration:underline;color:#fff}
.pp a{color:#8cf}.ppl{padding:10px 14px 0}.ppl h3{margin:4px 0 8px}.pcards{display:flex;flex-wrap:wrap;gap:8px}
.pcard{display:flex;gap:10px;align-items:center;width:250px;padding:6px;border:1px solid #8884;border-radius:8px;cursor:pointer;background:#ffffff08}.pcard:hover{border-color:#fff}
.pph{width:54px;height:54px;flex:none;border-radius:50%;overflow:hidden;background:#555;display:flex;align-items:center;justify-content:center;font-weight:bold}.pph img{width:100%;height:100%;object-fit:cover}
.pp{padding:14px}.pphead{display:flex;gap:18px;align-items:flex-start}.ppimg{width:185px;flex:none;border-radius:8px;overflow:hidden;background:#555;min-height:120px;display:flex;align-items:center;justify-content:center;font-size:40px}.ppimg img{width:100%;display:block}
.ppbio{max-width:900px;line-height:1.45;white-space:pre-line}.ppctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}.ppctl a{margin-right:10px}
.ppbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:16px 0 4px;padding:8px 0;border-top:1px solid #8884;border-bottom:1px solid #8884}.ppbar a{color:inherit}
.seg button{border-radius:0}.seg button.on{background:#2a6;color:#fff;border-color:#2a6}
.ppdept{margin:16px 0 6px}.pplist{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px}
.ppi{display:flex;gap:8px;padding:5px;border:2px solid #8883;border-radius:7px;color:inherit;text-decoration:none;position:relative}
.ppi.own{border-color:#f5c518;background:#f5c51814;cursor:pointer}.ppi.own:hover{background:#f5c51830}.ppi.not{opacity:.45}.ppi.not:hover{opacity:.85}
.ppt{width:46px;height:69px;flex:none;background:#4446;border-radius:3px;overflow:hidden}.ppt img{width:100%;height:100%;object-fit:cover}
.ppx{min-width:0}.ppy{font-weight:bold}.ppn{overflow:hidden;text-overflow:ellipsis}.pplib{position:static;display:inline-block;margin-top:3px;background:#f5c518;color:#000}
</style></head><body>
<div id="side">
 <div style="font-size:18px;font-weight:600;display:flex;align-items:center;gap:8px"><img src="/static/logo-icon.png" alt="" style="height:30px;width:30px;border-radius:6px">Film Tagger</div>
 <div class="muted" id="stats"></div>
 <h3>Tags (boolean)</h3>
 <label>Must have ALL (AND)</label><input id="f_all" list="taglist" placeholder="tag, tag">
 <label>Has ANY of (OR)</label><input id="f_any" list="taglist">
 <label>Must NOT have (NOT)</label><input id="f_none" list="taglist">
 <h3>Filters</h3>
 <label>Year</label><div class="row"><input id="f_year_min" type="number" placeholder="from"><input id="f_year_max" type="number" placeholder="to"></div>
 <label>Decade</label><input type=hidden id="f_decade"><div id="decadeChips"></div>
 <label>My rating</label><div class="row"><input id="f_rating_min" type="number" min=1 max=10 placeholder="min"><input id="f_rating_max" type="number" min=1 max=10 placeholder="max"></div>
 <label>Runtime (min)</label><div class="row"><input id="f_runtime_min" type="number" placeholder="min"><input id="f_runtime_max" type="number" placeholder="max"></div>
 <label>Country</label><input id="f_country" list="countrylist" placeholder="any country"><datalist id="countrylist"></datalist>
 <label>Studio</label><input id="f_studio" list="studiolist" placeholder="any studio"><datalist id="studiolist"></datalist>
 <label>Primary genre</label><input id="f_pgenre" list="pgenrelist" placeholder="any primary genre ((none) = not set)"><datalist id="pgenrelist"></datalist>
 <label>AZNude Status</label><select id="f_aznude"><option value="">Any</option><option>Hardcore</option><option>Softcore</option><option>Not found</option><option value="(none)">Unchecked</option></select>
 <label style="font-weight:normal"><input type=checkbox id=azColChk style="width:auto" onchange="S.azCol=this.checked;localStorage.azCol=this.checked?'1':'';render()"> AZNude column in list view</label>
 <label>Rating (MPAA)</label><input type=hidden id="f_mpaa"><div id="mpaaChips"></div>
 <label>Resolution</label><input type=hidden id="f_res"><div id="resChips"></div>
 <label>Watched</label><select id="f_watched"><option value="">Any</option><option value="1">Watched</option><option value="0">Unwatched</option></select>
 <label>Show only</label><select id="f_special"><option value="">All films</option><option value="pending">Pending AI tags</option><option value="queued">In smart-tag queue</option><option value="aznude_queued">In AZNude queue</option><option value="untagged">Untagged</option><option value="missing">Missing files</option><option value="needs_tmdb">Needs TMDB match</option><option value="nompaa">Matched, no MPAA rating</option></select>
 <div class="row" style="margin-top:8px"><button onclick="clearF()">Clear</button><button onclick="saveSearch()">Save search</button></div>
 <h3>Saved searches</h3><div id="saved" class="muted"></div>
 <h3>Tags <span class="muted">(click: AND · shift: NOT)</span></h3><div id="tagcloud" class="tagcloud"></div>
</div>
<div id="main">
 <div id="bar">
  <button id="homeBtn" onclick="goHome()" title="Home: reset all filters (Alt+H)">🏠 Home</button>
  <input type=hidden id="f_lib"><input type=hidden id="f_person"><input type=hidden id="f_prole"><div style="position:relative"><button id="libBtn" onclick="event.stopPropagation();toggleLibPop()" title="Library folder">📁 All libraries ▾</button>
  <div id="libPop" onclick="event.stopPropagation()"><input id="libSearch" placeholder="Filter folders…" autocomplete="off"><div id="libTree"></div></div></div>
  <select id="f_in" title="Which field the text search looks in"><option value="">Search in: Everything</option><option value="people">Search in: People</option><option value="title">Search in: Title</option><option value="plot">Search in: Plot</option><option value="cast">Search in: Cast</option><option value="director">Search in: Director</option><option value="notes">Search in: Notes</option><option value="tags">Search in: Tags</option><option value="path">Search in: File path</option><option value="country">Search in: Country</option><option value="studio">Search in: Studio</option><option value="resolution">Search in: Resolution</option></select>
  <input id="q" placeholder="Search everything…">
  <select id="sort" title="Sort order"><option value="title">Sort: Title</option><option value="year">Sort: Year</option><option value="rating">Sort: Rating</option><option value="runtime">Sort: Runtime</option><option value="added">Sort: Date added</option><option value="director">Sort: Director</option><option value="studio">Sort: Studio</option><option value="primary_genre">Sort: Primary genre</option><option value="aznude_status">Sort: AZNude Status</option></select>
  <button id="ord" onclick="S.order=S.order=='asc'?'desc':'asc';this.textContent=S.order=='asc'?'↑':'↓';load()">↑</button>
  <button onclick="setView('grid')">▦ Grid</button><button onclick="setView('table')">☰ Table</button>
  <button id="selAllBtn" onclick="selectAll()" title="Select every film in the current results (not just the ones loaded)">Select all</button><span id="count"></span><span id="jobBadge" class="tag" style="display:none;cursor:pointer" onclick="openSettings()"></span>
  <button onclick="openPending()" id="pendBtn">AI review</button>
  <button onclick="openQueue()" id="queueBtn">Queue</button>
  <button onclick="newFilm()">+ Film</button>
  <button onclick="openSettings()">⚙ Library & Settings</button>
 </div>
 <div id="jobbar"><b id="jbLabel"></b><div class="track"><div class="fill" id="jbFill"></div></div><span id="jbText"></span><button id="jbCancel" onclick="cancelJob()">Cancel</button><button id="jbClose" onclick="$('jobbar').style.display='none';S.jbHide=S.jbKey">×</button></div>
 <div id="bulk"><b id="selN"></b>
  <input id="bulkTag" list="taglist" placeholder="tag name" style="width:160px"><select id="bulkCat"></select>
  <button onclick="bulkTag(true)">Add tag</button><button onclick="bulkTag(false)">Remove tag</button>
  <button onclick="queueFilms([...S.sel])">✨ Smart tagging (AI)</button><button onclick="startJob('/api/ai/start',{film_ids:[...S.sel]})">⚡ Tag now</button>
  <select id="bulkMpaa" title="MPAA rating to apply (— clears it)"></select><button onclick="bulkMpaa()">Set MPAA rating</button>
  <select id="bulkRes" title="Resolution to apply (— clears it)"></select><button onclick="bulkRes()">Set resolution</button>
  <input id="bulkStudio" list="studiolist" placeholder="studio(s), comma-separated" style="width:170px" title="Studio to apply (empty clears it)"><button onclick="bulkStudio()">Set studio</button>
  <button onclick="bulkWatched(1)">Mark watched</button><button onclick="bulkWatched(0)">Unwatched</button>
  <button id="selAllBar" onclick="selectAll()">Select all results</button><button onclick="S.sel.clear();render()">Clear selection</button>
  <button onclick="bulkDelete()" style="color:var(--bad)">Remove from catalog</button>
 </div>
 <div id="personHdr" style="display:none;padding:8px 14px;border-bottom:1px solid #8884"></div>
 <div id="content"></div>
</div>
<datalist id="taglist"></datalist><datalist id="mpaalist"><option>G<option>PG<option>PG-13<option>R<option>NC-17<option>X<option>NR<option>Unrated<option>TV-G<option>TV-PG<option>TV-14<option>TV-MA</datalist>
<div id="modal" onclick="if(event.target==this)closeM()"><div id="mbox"></div></div>
<div id="ctx"></div><div id="toast"></div>
<script>
const S={view:localStorage.view||'grid',order:'asc',films:[],total:0,sel:new Set(),tags:[],cats:[],busy:false,lastClick:null};
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(u,o={}){if(o.body&&!(o.body instanceof FormData)){o.body=JSON.stringify(o.body);o.headers={'Content-Type':'application/json'}}
 const r=await fetch(u,o);const j=await r.json().catch(()=>({}));if(!r.ok){toast(j.error||r.statusText);throw j}return j}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3500)}
const FK=['all','any','none','year_min','year_max','rating_min','rating_max','runtime_min','runtime_max','watched','special','mpaa','lib','in','person','prole','country','studio','decade','res','pgenre','aznude'];
const INPH={'':'Search everything…',people:'Search people (actors, directors, writers…)…',title:'Search titles (incl. original/alternative)…',plot:'Search plots…',cast:'Search cast…',director:'Search directors…',notes:'Search notes…',tags:'Search tag names…',path:'Search file paths…',country:'Search countries…',studio:'Search studios…',resolution:'Search resolutions (e.g. 1080p)…'};
function setIn(v){$('f_in').value=v||'';localStorage.searchIn=$('f_in').value;$('q').placeholder=INPH[$('f_in').value]}
const RESL=['SD','480p','576p','720p','1080p','1440p','4K'];
const MPAA=['G','PG','PG-13','R','NC-17','X','NR','Unrated','TV-MA','(none)'];
function query(){const q={q:$('q').value};FK.forEach(k=>q[k]=$('f_'+k).value);return q}
function params(extra={}){const q=query(),p=new URLSearchParams();for(const k in q)if(q[k]&&k!='special')p.set(k,q[k]);if(q.special)p.set(q.special,1);
 p.set('sort',$('sort').value);p.set('order',S.order);for(const k in extra)p.set(k,extra[k]);return p}
let lt;function debLoad(){clearTimeout(lt);lt=setTimeout(load,250)}
function navState(){return {...query(),sort:$('sort').value,order:S.order}}
function snap(){const c=history.state;if(c)history.replaceState({...c,scroll:$('content').scrollTop,n:S.films.length},'')}
function histSave(){if(S.restoring)return;const st=navState(),cur=history.state;if(!cur){history.replaceState({...st,film:null},'');return}
 const base={...cur};delete base.film;delete base.scroll;delete base.n;delete base.page;if(JSON.stringify(st)==JSON.stringify(base)&&!cur.film&&!cur.page)return;
 const onlyQ=!cur.film&&!cur.page&&Object.keys(st).every(k=>k=='q'||st[k]==base[k]);if(onlyQ){history.replaceState({...st,film:null},'');return}
 snap();history.pushState({...st,film:null},'')}
function histFilm(id){if(S.restoring)return;const c=history.state||navState();if(c.film==id)return;snap();history.pushState({...navState(),film:id,page:S.page||null},'')}
window.addEventListener('popstate',async e=>{const q=e.state;if(!q)return;S.restoring=true;try{FK.forEach(k=>{if(k=='lib')setLib(q.lib||'');else if(k=='in')setIn(q.in||'');else $('f_'+k).value=q[k]||''});$('q').value=q.q||'';$('sort').value=q.sort||'title';S.order=q.order||'asc';$('ord').textContent=S.order=='asc'?'↑':'↓';renderMpaa();
 if(q.page&&String(q.page).startsWith('person:')){await showPerson(+String(q.page).slice(7),{nohist:true});$('content').scrollTop=q.scroll||0}
 else{S.page=null;const j=await api('/api/films?'+params({limit:Math.max(300,q.n||0),offset:0}));S.films=j.films;S.total=j.total;await searchPeople();render();personHeader();$('content').scrollTop=q.scroll||0}
 if(q.film)await openFilm(q.film);else closeM()}finally{S.restoring=false}});
async function load(keep){keep=keep===true;if(S.tagGroups)renderTagCloud();if(keep&&S.page)return showPerson(S.pageId,{keep:true,nohist:true});S.page=null;if(!keep)histSave();const st=$('content').scrollTop;const j=$('f_in').value=='people'?{films:[],total:0}:await api('/api/films?'+params({limit:keep?Math.max(300,S.films.length):300,offset:0}));await searchPeople();S.films=j.films;S.total=j.total;render();$('content').scrollTop=keep?st:0;personHeader()}
function reload(){return load(true)}
const ROLES={director:['director','Director'],cast:['actor','Cast'],writer:['writer','Writers'],producer:['producer','Producers'],cinematographer:['cinematographer','Cinematography'],composer:['composer','Music']};
const PF=[['director','director'],['cast_','cast'],['writers','writer'],['producers','producer'],['cinematographer','cinematographer'],['composer','composer']];
const jsq=s=>esc(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
async function personHeader(){const h=$('personHdr'),name=$('f_person').value,role=$('f_prole').value;
 if(!name){h.style.display='none';h.innerHTML='';return}
 let p;try{p=await api('/api/people?'+new URLSearchParams({name,role}))}catch(e){return}
 if($('f_person').value!==name||$('f_prole').value!==role)return;
 const n=p.total,fs=n==1?'film':'films',what=role?`as ${ROLES[role][0]}`:'in any role';
 const others=Object.entries(p.counts).filter(([r,c])=>c&&r!==role).map(([r,c])=>`<a href="#" onclick="filterPerson('${jsq(name)}','${r}');return false">${c} as ${ROLES[r][0]}</a>`);
 if(role)others.push(`<a href="#" onclick="filterPerson('${jsq(name)}','');return false">any role</a>`);
 h.innerHTML=`<b style="font-size:1.15em">${esc(p.name)}: ${n} ${fs} ${what}</b>${S.total!=n?` <span class=muted>(${S.total} shown with other filters)</span>`:''}${others.length?' <span class=muted>· also: '+others.join(' · ')+'</span>':''} <span style="margin-left:12px">Sort by <select onchange="$('sort').value=this.value;load()">${$('sort').innerHTML.replace(/Sort: /g,'').replace(`value="${$('sort').value}"`,`value="${$('sort').value}" selected`)}</select> <button onclick="S.order=S.order=='asc'?'desc':'asc';$('ord').textContent=S.order=='asc'?'↑':'↓';load()" title="Reverse order">${S.order=='asc'?'↑':'↓'}</button></span> <button style="margin-left:8px" onclick="filterPerson('')" title="Clear person filter">× Clear</button>`;h.style.display='block'}
function filterPerson(name,role=''){if(name)return openPersonByName(name);S.keepFilm=true;closeM();S.keepFilm=false;FK.forEach(k=>{if(k!='in'&&k!='lib')$('f_'+k).value=''});$('q').value='';renderMpaa();S.sel.clear();
 $('f_person').value=name||'';$('f_prole').value=name?role:'';load()}

async function saveWithTmdb(id,forceLoad){const d=formVals();const tid=tmdbIdOf(d.tmdb_id);
 if(tid===null){toast('That is not a TMDB id or themoviedb.org/movie/… link');return false}d.tmdb_id=tid;
 const newId=tid&&(forceLoad||String(tid)!=String(S.editOrig.tmdb_id??''));const keep=changedFields(d);
 const sv=await api('/api/films/'+id,{method:'PUT',body:d});
 if(sv.tmdb_loaded){toast('Loaded details from TMDB'+(keep.length?' (kept your edits: '+keep.join(', ')+')':''));S.editOrig=sv;return true}
 if(sv.tmdb_error){toast('Saved, but TMDB: '+sv.tmdb_error);return true}

  catch(e){openFilm(id);return false}}
 return true}

async function browseFolder(){const b=event.target;b.disabled=true;b.textContent='Choose in the dialog…';

 finally{b.disabled=false;b.textContent='Browse…'}}

function jobText(j){if(j.kind=='resolution')return `${j.done}/${j.total} · ${j.matched} detected · ${j.skipped} unknown${j.offline?' · '+j.offline+' on unplugged drives':''}${j.errors?' · '+j.errors+' errors':''}${j.running?(j.cancel?' · cancelling…':(j.eta_s!=null?' · ~'+Math.ceil(j.eta_s/60)+' min left':'')):' · finished'}`;
 if(j.kind=='scan')return `${j.found||0} video files found · ${j.added||0} new${j.running?'':(' · '+(j.missing_files||0)+' missing')}${j.cancelled?' · cancelled':''}`;
 const what=j.kind=='pgenre'?'filled':j.kind=='mpaa'?'rated':j.kind=='ai'?'films tagged':'matched',miss=j.kind=='pgenre'?'no TMDB genre':j.kind=='mpaa'?'no US rating':j.kind=='ai'?'no reply':'need match';
 return `${j.done}/${j.total} · ${j.matched} ${what} · ${j.skipped} ${miss}${j.errors?' · '+j.errors+' errors':''}${j.error?' — '+j.error:''}${j.running?(j.cancel?' · cancelling…':''):' · finished'}`}
function showJob(r){const j=r.scan&&r.scan.running?r.scan:(r.res&&r.res.running&&!r.job.running?r.res:r.job),sj=r.scan&&r.scan.running?r.scan:(r.res&&r.res.running?r.res:(r.res&&r.res.finished_at&&(!r.scan.finished_at||r.res.finished_at>r.scan.finished_at)?r.res:r.scan));
 const recent=x=>x&&x.finished_at&&(Date.now()/1000-x.finished_at<8);
 let cur=j.running?j:(sj&&recent(sj)&&(!r.job.finished_at||sj.finished_at>r.job.finished_at)?sj:(recent(r.job)?r.job:null));
 const el=$('pjob');if(el)el.textContent=r.job.total!=null?jobText(r.job):'';
 const bar=$('jobbar');if(!cur){bar.style.display='none';return}
 const key=cur.kind+(cur.finished_at||'run');if(S.jbHide==key){bar.style.display='none';return}S.jbKey=key;
 bar.style.display='flex';bar.className=cur.running?'':(cur.error?'err':'done');

 $('jbFill').style.width=cur.kind=='scan'?(cur.running?'100%':'100%'):(cur.total?Math.round(100*cur.done/cur.total):100)+'%';
 $('jbText').textContent=jobText(cur).replace(/^\d+\/\d+ · /,'');$('jbCancel').style.display=cur.running?'':'none';$('jbCancel').dataset.kind=cur.kind}
async function pollJob(){clearTimeout(pt);let r;try{r=await api('/api/jobs')}catch(e){return}showJob(r);

 else{if(S.wasRunning){S.wasRunning=false;reload();refreshMeta();loadLibs()}pt=setTimeout(pollJob,(r.job.finished_at||r.scan.finished_at||rs.finished_at)&&Date.now()/1000-Math.max(r.job.finished_at||0,r.scan.finished_at||0,rs.finished_at||0)<9?1000:15000)}}

function togRes(r){const on=new Set(($('f_res').value||'').split(',').filter(Boolean));on.has(r)?on.delete(r):on.add(r);$('f_res').value=[...RESL,'(none)'].filter(x=>on.has(x)).join(',');renderRes();load()}
async function loadRes(){try{S.resCounts=await api('/api/resolutions');renderRes()}catch(e){}}
function renderDecades(){const on=new Set(($('f_decade').value||'').split(',').filter(Boolean));
 $('decadeChips').innerHTML=(S.decades||[]).map(d=>`<span class="chip ${on.has(String(d.decade))?'on':''}" title="${d.n} films" onclick="togDecade('${d.decade}')">${d.decade}s</span>`).join('')}
function togDecade(d){const on=new Set(($('f_decade').value||'').split(',').filter(Boolean));on.has(d)?on.delete(d):on.add(d);$('f_decade').value=[...on].sort().join(',');renderDecades();load()}
function filterDecade(d){S.keepFilm=true;closeM();S.keepFilm=false;FK.forEach(k=>{if(k!='in'&&k!='lib')$('f_'+k).value=''});$('q').value='';setLib('');S.sel.clear();$('f_decade').value=String(d);renderMpaa();load()}
async function loadDecades(){try{S.decades=await api('/api/decades');renderDecades()}catch(e){}}
function renderMpaa(){renderDecades();renderRes();const on=new Set(($('f_mpaa').value||'').split(',').filter(Boolean));
 $('mpaaChips').innerHTML=MPAA.map(m=>`<span class="chip ${on.has(m)?'on':''}" onclick="togMpaa('${m}')">${m}</span>`).join('')}
function togMpaa(m){const on=new Set(($('f_mpaa').value||'').split(',').filter(Boolean));on.has(m)?on.delete(m):on.add(m);$('f_mpaa').value=[...on].join(',');renderMpaa();load()}
S.libs=[];S.libOpen=new Set(JSON.parse(localStorage.libOpen||'[]'));
async function loadLibs(){S.libs=await api('/api/libraries');setLib($('f_lib').value||'',true);if($('libPop').classList.contains('open'))renderLibTree()}
function libLabel(v){if(!v)return 'All libraries';for(const l of S.libs){if(l.path==v)return `${l.path} (${l.count})`;const s=l.subfolders.find(s=>s.path==v);if(s)return `${l.path} › ${s.name} (${s.count})`}return v+' (not configured)'}
function setLib(v,quiet){$('f_lib').value=v;localStorage.lib=v;$('libBtn').textContent='📁 '+libLabel(v)+' ▾';$('libBtn').title=v||'All libraries'}
function pickLib(v){setLib(v);$('libPop').classList.remove('open');load()}
function toggleLibPop(){const p=$('libPop');p.classList.toggle('open');if(p.classList.contains('open')){$('libSearch').value='';renderLibTree();$('libSearch').focus()}}
function toggleRoot(i){const p=S.libs[i].path;S.libOpen.has(p)?S.libOpen.delete(p):S.libOpen.add(p);localStorage.libOpen=JSON.stringify([...S.libOpen]);renderLibTree()}
const LIBMAX=500;
function renderLibTree(){const q=$('libSearch').value.trim().toLowerCase(),cur=$('f_lib').value,out=[];
 const row=(v,label,n,cls,arrow)=>`<div class="lr ${cls} ${v==cur?'cur':''}" data-v="${esc(v)}">${arrow??''}<span class=nm title="${esc(label)}">${esc(label)}</span>${n!=null?`<span class=n>${n}</span>`:''}</div>`;
 if(!q)out.push(row('','All libraries',null,'','<span class=ar></span>'));
 S.libs.forEach((l,i)=>{let subs=l.subfolders,open=S.libOpen.has(l.path);
  if(q){subs=subs.filter(s=>s.name.toLowerCase().includes(q));const rootHit=l.path.toLowerCase().includes(q);if(!subs.length&&!rootHit)return;open=subs.length>0}
  const ar=l.subfolders.length?`<span class=ar data-t="${i}">${open?'▾':'▸'}</span>`:'<span class=ar></span>';
  out.push(row(l.path,l.path,l.count,'',ar));
  if(open){subs.slice(0,LIBMAX).forEach(s=>out.push(row(s.path,s.name,s.count,'sub')));
   if(subs.length>LIBMAX)out.push(`<div class="lr sub muted">…${subs.length-LIBMAX} more — type to filter</div>`)}});
 if(!S.libs.length)out.push('<div class="muted" style="padding:6px">No library folders configured yet (Library & Settings).</div>');
 else if(q&&out.length==0)out.push('<div class="muted" style="padding:6px">No matching folders.</div>');
 $('libTree').innerHTML=out.join('')}
$('libTree').addEventListener('click',e=>{const t=e.target.closest('[data-t]');if(t)return toggleRoot(+t.dataset.t);const r=e.target.closest('[data-v]');if(r)pickLib(r.dataset.v)});
let lst;$('libSearch').addEventListener('input',()=>{clearTimeout(lst);lst=setTimeout(renderLibTree,120)});
$('libSearch').addEventListener('keydown',e=>{if(e.key=='Escape'){e.stopPropagation();$('libPop').classList.remove('open')}if(e.key=='Enter'){const r=$('libTree').querySelector('.lr.sub[data-v],.lr[data-v]:not([data-v=""])');if(r)pickLib(r.dataset.v)}});
document.addEventListener('click',()=>$('libPop').classList.remove('open'));
async function saveAI(){await api('/api/settings',{method:'PUT',body:{ai_url:$('s_aiurl').value,ai_model:$('s_aimodel').value,ai_key:$('s_aikey').value}});$('s_aikey').value='';toast('AI settings saved');openSettings()}
async function testAI(){$('aiRes').textContent='Testing…';try{const r=await api('/api/ai/test',{method:'POST',body:{ai_url:$('s_aiurl').value,ai_model:$('s_aimodel').value,ai_key:$('s_aikey').value}});$('aiRes').textContent='✓ Works ('+r.endpoint+'): '+r.reply}catch(e){$('aiRes').textContent='✗ '+(e.error||'failed')}}
async function copyPrompt(){const [p,q]=await Promise.all([fetch('/api/prompt').then(r=>r.ok?r.text():''),api('/api/queue/export')]);
 const slim=q.map(f=>({id:f.id,title:f.title,year:f.year,director:f.director,path:f.path,existing_tags:f.existing_tags.map(t=>t.name)}));
 const txt=(p||'Suggest tags for each film. Reply ONLY with JSON [{"film_id":..,"tags":[{"name":..,"category":..}]}]\nFilms:\n')+'\n'+JSON.stringify(slim,null,1);
 try{await navigator.clipboard.writeText(txt);toast('Prompt copied – paste it into your AI chatbot')}catch(e){$('impj').value=txt;toast('Could not access clipboard – prompt placed in the box below, copy it from there')}}
async function quitApp(){if(!confirm('Stop Film Tagger? (Start it again from the Desktop icon.)'))return;await api('/api/shutdown',{method:'POST',body:{}}).catch(()=>{});document.body.innerHTML='<div style="margin:auto;font-size:18px">Film Tagger has stopped. You can close this window.</div>'}
async function doScan(){const roots=$('s_roots').value.split('\n').map(s=>s.trim()).filter(Boolean);await api('/api/settings',{method:'PUT',body:{roots}});
 $('scanRes').textContent='Scanning… (progress in the bar at the top)';S.jbHide=null;setTimeout(pollJob,300);const r=await api('/api/scan',{method:'POST',body:{roots}});
 $('scanRes').textContent=`Found ${r.found} video files, ${r.added} new, ${r.missing_files} missing. ${r.errors.join('; ')}`;refreshMeta();load();loadLibs();pollJob()}
async function doImport(){const f=$('s_file').files[0];if(!f)return;if(f.name.endsWith('.json')&&!confirm('This REPLACES your whole database. Continue?'))return;
 const fd=new FormData();fd.append('file',f);const r=await api('/api/import',{method:'POST',body:fd});toast('Imported: '+JSON.stringify(r));refreshMeta();load()}
// ---------- person search + person pages ----------
S.people=[];S.peopleTotal=0;S.page=null;S.ppOnly=localStorage.ppOnly=='1';S.ppDesc=localStorage.ppDesc=='1';
const RLBL={director:'Director',cast:'Actor',writer:'Writer',producer:'Producer',cinematographer:'Cinematographer',composer:'Composer'};
const initials=n=>esc(String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase());
async function searchPeople(){const q=$('q').value.trim(),inn=$('f_in').value;
 if(!q||!['','people','cast','director'].includes(inn)){S.people=[];S.peopleTotal=0;return}
 try{const j=await api('/api/people/search?'+new URLSearchParams({q,limit:inn=='people'?120:12}));if($('q').value.trim()!==q)return;S.people=j.people;S.peopleTotal=j.total}catch(e){S.people=[];S.peopleTotal=0}}
function peopleSection(){if(!S.people.length)return $('f_in').value=='people'&&$('q').value.trim()?'<div class=ppl><h3>People</h3><p class=muted>No people in your library match.</p></div>':'';
 return `<div class=ppl><h3>People <span class=muted>(${S.peopleTotal}${S.peopleTotal>S.people.length?', showing '+S.people.length:''})</span>${$('f_in').value!='people'&&S.peopleTotal>S.people.length?` <a href="#" onclick="setIn('people');load();return false" style="font-size:.8em">show all people</a>`:''}</h3><div class=pcards>${S.people.map(p=>`<div class=pcard data-pname="${esc(p.name)}" title="Open ${esc(p.name)}'s page">
 <div class=pph>${p.photo?`<img loading=lazy src="${esc(p.photo)}">`:`<span>${initials(p.name)}</span>`}</div><div><b>${esc(p.name)}</b><div class=muted>${esc(p.known_for||RLBL[p.role]||'')}</div><div class=muted>${p.n} film${p.n==1?'':'s'} in library</div></div></div>`).join('')}</div>${$('f_in').value!='people'&&S.films.length?'<h3 style="margin:10px 0 0">Films</h3>':''}</div>`}
$('content').addEventListener('click',e=>{const el=e.target.closest('[data-pname]');if(!el)return;e.preventDefault();openPersonByName(el.dataset.pname)});
async function openPersonByName(name){if(!name){S.page=null;return load()}S.keepFilm=true;closeM();S.keepFilm=false;
 const r=await api('/api/person/lookup?'+new URLSearchParams({name}));return showPerson(r.id)}
async function showPerson(pid,opt={}){
 if(!S.restoring&&!opt.nohist){const cur=history.state;if(!(cur&&cur.page=='person:'+pid&&!cur.film)){snap();history.pushState({...navState(),film:null,page:'person:'+pid},'')}}
 S.page='person:'+pid;S.pageId=pid;$('personHdr').style.display='none';
 if(!opt.keep){$('content').innerHTML='<div class=pp><p class=muted>Loading…</p></div>';$('content').scrollTop=0}
 let d;try{d=await api('/api/person/'+pid+(opt.refresh?'?refresh=1':''))}catch(e){$('content').innerHTML='<div class=pp><p>Could not load this person.</p></div>';return}
 if(S.page!=='person:'+pid)return;S.ppData=d;const st=$('content').scrollTop;renderPerson();if(opt.keep)$('content').scrollTop=st}
function fmtDate(s){if(!s)return '';const d=new Date(s+'T00:00:00');return isNaN(d)?s:d.toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})}
function ageAt(b,e){if(!b)return '';const x=new Date(b),y=e?new Date(e):new Date();let a=y.getFullYear()-x.getFullYear();if(y.getMonth()<x.getMonth()||(y.getMonth()==x.getMonth()&&y.getDate()<x.getDate()))a--;return isNaN(a)?'':` (${e?'aged':'age'} ${a})`}
function renderPerson(){const d=S.ppData,p=d.person,c=$('content');$('count').textContent='';
 const bio=(p.bio||'').trim(),short=bio.length>420?bio.slice(0,420).replace(/\s+\S*$/,'')+'…':bio;
 const roles=Object.entries(d.roles).sort((a,b)=>b[1]-a[1]).map(([r,n])=>`${n} as ${ROLES[r][0]}`).join(' · ');
 let h=`<div class=pp><div class=pphead><div class=ppimg>${p.photo?`<img src="${esc(p.photo)}" alt="">`:`<span>${initials(p.name)}</span>`}</div><div style="flex:1;min-width:0">
 <button style="float:right" onclick="history.back()" title="Back (Alt+←)">← Back</button>
 <h2 style="margin:0 0 4px">${esc(p.name)}</h2>${p.aka.length?`<div class=muted>Also credited as ${p.aka.map(esc).join(', ')}</div>`:''}
 <div class=muted>${p.known_for?`Known for: <b>${esc(p.known_for)}</b>`:''}${roles?` · In your library: ${roles}`:''}</div>
 ${p.birthday?`<div>Born ${fmtDate(p.birthday)}${p.deathday?'':ageAt(p.birthday)}${p.place?' in '+esc(p.place):''}</div>`:p.place?`<div>Born in ${esc(p.place)}</div>`:''}
 ${p.deathday?`<div>Died ${fmtDate(p.deathday)}${ageAt(p.birthday,p.deathday)}</div>`:''}
 ${bio?`<p id=ppbio class=ppbio>${esc(short)}${short!==bio?` <a href="#" onclick="$('ppbio').textContent=S.ppData.person.bio;return false">more</a>`:''}</p>`:''}
 ${d.message?`<p class=muted>⚠ ${esc(d.message)}</p>`:''}
 <div class=ppctl>${p.tmdb_url?`<a href="${esc(p.tmdb_url)}" target=_blank rel=noopener>TMDB page ↗</a>`:''}
 <span class=muted>TMDB person:</span><input id=ppTmdb placeholder="id or TMDB URL" value="${p.tmdb_person_id||''}" style="width:170px"><button onclick="setPersonTmdb(${p.id})">Set</button>${p.manual?`<button onclick="setPersonTmdb(${p.id},true)" title="Forget the manual id and auto-detect again">Auto</button>`:''}<button id=ppRef onclick="ppRefresh(${p.id})" title="Re-fetch from TMDB">↻ Refresh</button><span id=ppRefMsg class=muted style="margin-left:6px"></span></div>
 <div class=muted style="font-size:.85em">${p.fetched_at?`Last updated: ${new Date(p.fetched_at*1000).toLocaleString(undefined,{year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}`:'Last updated: never (not fetched from TMDB yet)'}</div>
 </div></div>`;
 if(d.groups&&d.groups.length){
  h+=`<div class=ppbar><b>You have ${d.owned} of ${d.total}</b><span class=seg><button class="${S.ppOnly?'':'on'}" onclick="ppOnly(0)">All films</button><button class="${S.ppOnly?'on':''}" onclick="ppOnly(1)">Only films I have</button></span>
  <span>Sort: <button onclick="ppSort()" title="Toggle year order">Year ${S.ppDesc?'↓ newest first':'↑ oldest first'}</button></span>
  <span class=muted>Jump to: ${d.groups.map((g,i)=>`<a href="#" onclick="document.getElementById('ppg${i}').scrollIntoView();return false">${esc(g.dept)}</a>`).join(' · ')}</span></div>`;
  d.groups.forEach((g,i)=>{let l=g.credits.filter(x=>!S.ppOnly||x.film_id);if(S.ppDesc)l=[...l].reverse();const own=g.credits.filter(x=>x.film_id).length;
   h+=`<h3 id=ppg${i} class=ppdept>${esc(g.dept)} <span class=muted>— you have ${own} of ${g.credits.length}</span></h3>`+(l.length?`<div class=pplist>${l.map(x=>{
    const img=x.film_id&&x.poster?x.poster:x.thumb,inner=`<div class=ppt>${img?`<img loading=lazy src="${esc(img)}">`:''}</div><div class=ppx><div class=ppy>${x.year||'—'}</div><div class=ppn>${esc(x.title)}</div>${x.role?`<div class=muted>${esc(x.role)}</div>`:''}${x.film_id?'<span class="badge pplib">In library</span>':''}</div>`;
    return x.film_id?`<div class="ppi own" data-id="${x.film_id}" title="Open ${esc(x.title)}">${inner}</div>`:`<a class="ppi not" href="https://www.themoviedb.org/movie/${x.tmdb_id}" target=_blank rel=noopener title="Not in your library — open on TMDB">${inner}</a>`}).join('')}</div>`:'<p class=muted>None in your library.</p>')});
 }else{
  let l=[...d.library];if(S.ppDesc)l.reverse();
  h+=`<div class=ppbar><b>${l.length} film${l.length==1?'':'s'} in your library</b><span>Sort: <button onclick="ppSort()">Year ${S.ppDesc?'↓ newest first':'↑ oldest first'}</button></span></div><div class=pplist>${l.map(f=>{const img=f.custom_poster||f.poster;
   return `<div class="ppi own" data-id="${f.id}"><div class=ppt>${img?`<img loading=lazy src="${esc(img)}">`:''}</div><div class=ppx><div class=ppy>${f.year||'—'}</div><div class=ppn>${esc(f.title)}</div><div class=muted>${f.roles.map(r=>RLBL[r]).join(', ')}</div></div></div>`}).join('')}</div>`}
 c.innerHTML=h+'</div>'}
function ppOnly(v){S.ppOnly=!!v;localStorage.ppOnly=v?'1':'0';renderPerson()}
function ppSort(){S.ppDesc=!S.ppDesc;localStorage.ppDesc=S.ppDesc?'1':'0';renderPerson()}
async function ppRefresh(pid){const b=$('ppRef');if(!b||b.disabled)return;const prev=S.ppData;b.disabled=true;b.textContent='⟳ Refreshing…';
 let d;try{d=await api('/api/person/'+pid+'?refresh=1')}catch(e){if(S.page==='person:'+pid){b.disabled=false;b.textContent='↻ Refresh'}toast("Couldn't reach Film Tagger: "+(e.message||e));return}
 if(S.page!=='person:'+pid)return;const st=$('content').scrollTop;S.ppData=d;renderPerson();$('content').scrollTop=st;
 const fresh=d.person.fetched_at&&(!prev||d.person.fetched_at!==prev.person.fetched_at);
 if(!fresh||d.status==='offline'){toast(d.status==='no_key'?'No TMDB API key set':d.status==='no_match'?'No matching person on TMDB':"Couldn't reach TMDB"+(d.message?' — '+d.message:''));return}
 const ch=[];if(prev&&prev.total!==d.total)ch.push(`films ${prev.total} → ${d.total}`);if(prev&&prev.owned!==d.owned)ch.push(`in library ${prev.owned} → ${d.owned}`);
 if(prev&&(prev.person.bio||'')!==(d.person.bio||''))ch.push('bio updated');
 const m=$('ppRefMsg');if(m)m.textContent='✓ Updated just now';
 toast(`Updated from TMDB — Filmography: ${d.total} film${d.total==1?'':'s'}, you have ${d.owned}`+(ch.length?` (${ch.join(', ')})`:' (no changes)'))}
async function setPersonTmdb(pid,auto){await api('/api/person/'+pid+'/tmdb',{method:'POST',body:{tmdb:auto?'':$('ppTmdb').value}});showPerson(pid,{keep:true,nohist:true})}
S.azCol=localStorage.azCol=='1';$('azColChk').checked=S.azCol;renderMpaa();setLib('');setIn(localStorage.searchIn||'');$('f_in').addEventListener('change',e=>{setIn(e.target.value);if($('q').value.trim())load()});loadLibs().then(load);refreshMeta();pollJob();
</script></body></html>
