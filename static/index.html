flex;align-items:center;justify-content:center;touch-action:none;user-select:none}

<script>
const S={view:localStorage.view||'grid',order:'asc',films:[],total:0,sel:new Set(),tags:[],cats:[],busy:false,lastClick:null};
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(u,o={}){if(o.body&&!(o.body instanceof FormData)){o.body=JSON.stringify(o.body);o.headers={'Content-Type':'application/json'}}
 const r=await fetch(u,o);const j=await r.json().catch(()=>({}));if(!r.ok){toast(j.error||r.statusText);throw j}return j}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3500)}
const FK=['all','any','none','year_min','year_max','rating_min','rating_max','runtime_min','runtime_max','watched','special','mpaa','lib','in','person','prole','country','studio','decade','res','pgenre','aznude','subs'];
const INPH={'':'Search everything…',people:'Search people (actors, directors, writers…)…',title:'Search titles (incl. original/alternative)…',plot:'Search plots…',cast:'Search cast…',director:'Search directors…',notes:'Search notes…',tags:'Search tag names…',path:'Search file paths…',country:'Search countries…',studio:'Search studios…',resolution:'Search resolutions (e.g. 1080p)…',subtitles:'Search subtitles (e.g. English, SRT)…'};
function setIn(v){$('f_in').value=v||'';localStorage.searchIn=$('f_in').value;$('q').placeholder=INPH[$('f_in').value]}
const RESL=['SD','480p','576p','720p','1080p','1440p','4K'];
const MPAA=['G','PG','PG-13','R','NC-17','X','NR','Unrated','TV-MA','(none)'];
function query(){const q={q:$('q').value};FK.forEach(k=>q[k]=$('f_'+k).value);return q}
function params(extra={}){const q=query(),p=new URLSearchParams();for(const k in q)if(q[k]&&k!='special')p.set(k,q[k]);if(q.special)p.set(q.special,1);
 p.set('sort',$('sort').value);p.set('order',S.order);for(const k in extra)p.set(k,extra[k]);return p}
let lt;function debLoad(){clearTimeout(lt);lt=setTimeout(load,250)}
function navState(){return {...query(),sort:$('sort').value,order:S.order}}
function snap(){const c=history.state;if(c)history.replaceState({...c,scroll:$('content').scrollTop,n:S.films.length},'')}
function histSave(){if(S.restoring)return;const st=navState(),cur=history.state;if(!cur){history.replaceState({...st,film:null},'');return}
 const base={...cur};delete base.film;delete base.scroll;delete base.n;delete base.page;if(JSON.stringify(st)==JSON.stringify(base)&&!cur.film&&!cur.page)return;
 const onlyQ=!cur.film&&!cur.page&&Object.keys(st).every(k=>k=='q'||st[k]==base[k]);if(onlyQ){history.replaceState({...st,film:null},'');return}
 snap();history.pushState({...st,film:null},'')}
function histFilm(id){if(S.restoring)return;const c=history.state||navState();if(c.film==id)return;snap();history.pushState({...navState(),film:id,page:S.page||null},'')}
window.addEventListener('popstate',async e=>{const q=e.state;if(!q)return;S.restoring=true;try{FK.forEach(k=>{if(k=='lib')setLib(q.lib||'');else if(k=='in')setIn(q.in||'');else $('f_'+k).value=q[k]||''});$('q').value=q.q||'';$('sort').value=q.sort||'title';S.order=q.order||'asc';$('ord').textContent=S.order=='asc'?'↑':'↓';renderMpaa();
 if(q.page&&String(q.page).startsWith('person:')){await showPerson(+String(q.page).slice(7),{nohist:true});$('content').scrollTop=q.scroll||0}
 else{S.page=null;const j=await api('/api/films?'+params({limit:Math.max(300,q.n||0),offset:0}));S.films=j.films;S.total=j.total;await searchPeople();render();personHeader();$('content').scrollTop=q.scroll||0}
 if(q.film)await openFilm(q.film);else closeM()}finally{S.restoring=false}});
async function load(keep){keep=keep===true;if(S.tagGroups)renderTagCloud();if(keep&&S.page)return showPerson(S.pageId,{keep:true,nohist:true});S.page=null;if(!keep)histSave();const st=$('content').scrollTop;const j=$('f_in').value=='people'?{films:[],total:0}:await api('/api/films?'+params({limit:keep?Math.max(300,S.films.length):300,offset:0}));await searchPeople();S.films=j.films;S.total=j.total;render();$('content').scrollTop=keep?st:0;personHeader()}
function reload(){return load(true)}
const ROLES={director:['director','Director'],cast:['actor','Cast'],writer:['writer','Writers'],producer:['producer','Producers'],cinematographer:['cinematographer','Cinematography'],composer:['composer','Music']};
const PF=[['director','director'],['cast_','cast'],['writers','writer'],['producers','producer'],['cinematographer','cinematographer'],['composer','composer']];
const jsq=s=>esc(String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"));  // JS-escape first: the attribute decodes &#39; back to a quote
async function personHeader(){const h=$('personHdr'),name=$('f_person').value,role=$('f_prole').value;
 if(!name){h.style.display='none';h.innerHTML='';return}
 let p;try{p=await api('/api/people?'+new URLSearchParams({name,role}))}catch(e){return}
 if($('f_person').value!==name||$('f_prole').value!==role)return;
 const n=p.total,fs=n==1?'film':'films',what=role?`as ${ROLES[role][0]}`:'in any role';
 const others=Object.entries(p.counts).filter(([r,c])=>c&&r!==role).map(([r,c])=>`<a href="#" onclick="filterPerson('${jsq(name)}','${r}');return false">${c} as ${ROLES[r][0]}</a>`);
 if(role)others.push(`<a href="#" onclick="filterPerson('${jsq(name)}','');return false">any role</a>`);
 h.innerHTML=`<b style="font-size:1.15em">${esc(p.name)}: ${n} ${fs} ${what}</b>${S.total!=n?` <span class=muted>(${S.total} shown with other filters)</span>`:''}${others.length?' <span class=muted>· also: '+others.join(' · ')+'</span>':''} <span style="margin-left:12px">Sort by <select onchange="$('sort').value=this.value;load()">${$('sort').innerHTML.replace(/Sort: /g,'').replace(`value="${$('sort').value}"`,`value="${$('sort').value}" selected`)}</select> <button onclick="S.order=S.order=='asc'?'desc':'asc';$('ord').textContent=S.order=='asc'?'↑':'↓';load()" title="Reverse order">${S.order=='asc'?'↑':'↓'}</button></span> <button style="margin-left:8px" onclick="filterPerson('')" title="Clear person filter">× Clear</button>`;h.style.display='block'}
function filterPerson(name,role=''){if(name)return openPersonByName(name);S.keepFilm=true;closeM();S.keepFilm=false;FK.forEach(k=>{if(k!='in'&&k!='lib')$('f_'+k).value=''});$('q').value='';renderMpaa();S.sel.clear();
 $('f_person').value=name||'';$('f_prole').value=name?role:'';load()}
const MPAA_ALL=['G','PG','PG-13','R','NC-17','X','NR','Unrated','TV-Y','TV-Y7','TV-G','TV-PG','TV-14','TV-MA'];
function mpaaOpts(v){v=v||'';const l=['',...MPAA_ALL];if(v&&!l.includes(v))l.push(v);return l.map(m=>`<option value="${esc(m)}" ${m==v?'selected':''}>${m?esc(m):'—'}</option>`).join('')}
function peopleField(f,k,role){const v=f[k]||'',names=v.split(',').map(s=>s.trim()).filter(Boolean);
 return `<div><label>${ROLES[role][1]} <a href="#" title="Edit names" style="text-decoration:none" onclick="togglePF('${k}');return false">✏️</a></label>
 <div id=pv_${k} class=plinks style="min-height:1.6em">${names.map(n=>`<a href="#" title="Open ${esc(n)}'s page" onclick="filterPerson('${jsq(n)}','${role}');return false">${esc(n)}</a>`).join(', ')||'<span class=muted>—</span>'}</div>
 <div style="position:relative"><input id=e_${k} value="${esc(v)}" style="display:none" autocomplete=off placeholder="Names, comma-separated" oninput="pAC(this)" onblur="setTimeout(()=>pACclose(),200)"><div id=pac_${k} class=pac></div></div></div>`}
async function pAC(el){const k=el.id.slice(2),box=$('pac_'+k),tok=el.value.split(',').pop().trim();if(tok.length<2){box.style.display='none';return}
 let j;try{j=await api('/api/people/search?'+new URLSearchParams({q:tok,limit:8}))}catch(e){return}if(el.value.split(',').pop().trim()!==tok)return;
 if(!j.people.length){box.style.display='none';return}
 box.innerHTML=j.people.map(p=>`<div onmousedown="event.preventDefault();pACpick('${k}','${jsq(p.name)}')">${esc(p.name)} <span class=muted>${p.n?p.n+' film'+(p.n==1?'':'s'):'added by hand'}</span></div>`).join('');box.style.display='block'}
function pACpick(k,name){const el=$('e_'+k),parts=el.value.split(',');parts[parts.length-1]=' '+name;el.value=parts.join(',').replace(/^\s+/,'')+', ';$('pac_'+k).style.display='none';el.focus()}
function pACclose(){document.querySelectorAll('.pac').forEach(b=>b.style.display='none')}
function togglePF(k){const i=$('e_'+k),v=$('pv_'+k),edit=i.style.display=='none';i.style.display=edit?'':'none';v.style.display=edit?'none':'';if(edit)i.focus()}
async function more(){if(S.page||S.busy||S.films.length>=S.total)return;S.busy=true;
 const j=await api('/api/films?'+params({limit:300,offset:S.films.length}));S.films.push(...j.films);S.busy=false;render(true)}
$('content').addEventListener('scroll',e=>{const c=e.target;if(c.scrollTop+c.clientHeight>c.scrollHeight-800)more()});
function setView(v){S.view=localStorage.view=v;render()}
function tagsHtml(f,rm){return [...f.tags].sort((x,y)=>x.name.localeCompare(y.name,undefined,{sensitivity:'base'})).map(t=>`<span class="tag"><a class=tlink href="#" title="Show all films tagged ${esc(t.name)}" onclick="event.stopPropagation();filterTag('${jsq(t.name)}');return false">${esc(t.name)}</a>${t.category?`<span class=c style="margin:0 0 0 5px">${esc(t.category)}</span>`:''}${rm?`<x onclick="rmTag(${f.id},'${esc(t.name).replace(/'/g,"\\'")}')">×</x>`:''}</span>`).join('')}
function render(){
 $('count').textContent=`${S.total.toLocaleString()} films`;
 const n=S.sel.size;$('bulk').style.display=n?'flex':'none';$('selN').textContent=n+' selected';$('selAllBtn').textContent=$('selAllBar').textContent='Select all ('+S.total+')';$('selAllBtn').style.display=S.total?'':'none';if(!$('bulkMpaa').options.length)$('bulkMpaa').innerHTML=mpaaOpts('');if(!$('bulkRes').options.length)$('bulkRes').innerHTML=resOpts('');
 const c=$('content');if(S.page)return;
 if(S.view=='grid'){c.innerHTML='<div class="grid">'+S.films.map(f=>`<div class="card ${S.sel.has(f.id)?'sel':''}${f.soft_match?' soft':''}" data-id="${f.id}"><input type=checkbox class=cb title="Select" ${S.sel.has(f.id)?'checked':''}>${f.soft_match?'<span class="badge b-soft" title="Soft match: file not renamed yet">⚑</span>':''}
  <div class="po">${posterOf(f)?`<img loading="lazy" src="${esc(posterOf(f))}"${focusStyle(f)}>`:esc(f.title)}</div>
  ${f.pending.length?`<span class="badge b-ai">AI ${f.pending.length}</span>`:''}${f.queued?'<span class="badge b-q">queued</span>':''}
  ${f.missing?'<span class="badge b-miss">missing</span>':''}${f.gallery_count&&!/review by hand/i.test(f.notes||'')?`<span class="badge b-g" title="Photo gallery: ${f.gallery_count} photos">📷 ${f.gallery_count}</span>`:''}${f.watched&&!f.pending.length?'<span class="badge b-w">✓</span>':''}
  <div class="ti" title="${esc(f.title)}">${esc(f.title)}</div>${f.kind=='scene'&&f.cast_?`<div class="su pf" title="${esc(f.cast_)}">${esc(f.cast_)}</div>`:''}${f.kind=='scene'?`<div class="su st" title="${esc([f.studio,f.release_date||f.year,f.runtime&&f.runtime+'m'].filter(Boolean).join(' · '))}">${f.studio?`<a href="#" class=stl title="Show all ${esc(f.studio)} scenes" onclick="event.stopPropagation();filterStudio('${jsq(f.studio)}');return false">${esc(f.studio)}</a>`:''}${[f.year,f.runtime&&f.runtime+'m'].filter(Boolean).map(x=>' · '+x).join('')}</div>`:`<div class="su">${f.year||''}${f.mpaa?`<span class=mp>${esc(f.mpaa)}</span>`:''} ${f.rating?'· ★'+f.rating:''} ${f.runtime?'· '+f.runtime+'m':''}</div>`}${f.kind!='scene'&&f.primary_genre?`<div class="su pg" title="Primary genre">${esc(f.primary_genre)}</div>`:''}</div>`).join('')+'</div>'}
 else{const cols=[['title','Title'],['year','Year'],['director','Director'],['primary_genre','Genre'],['country','Country'],['studio','Studio'],['resolution','Res'],['runtime','Min'],['rating','★'],['mpaa','MPAA'],['watched','Seen'],[null,'Tags']];if(S.azCol)cols.splice(4,0,['aznude_status','AZNude']);
  c.innerHTML='<table><thead><tr><th><input type=checkbox onclick="event.stopPropagation();this.checked?selectAll():(S.sel.clear(),render())"></th>'+cols.map(([k,l])=>`<th ${k?`onclick="sortBy('${k}')"`:''}>${l}${$('sort').value==k?(S.order=='asc'?' ▲':' ▼'):''}</th>`).join('')+'</tr></thead><tbody>'+
  S.films.map(f=>`<tr data-id="${f.id}" class="${S.sel.has(f.id)?'sel':''}"><td><input type=checkbox ${S.sel.has(f.id)?'checked':''}></td><td>${esc(f.title)}${f.missing?' <span class="tag" style="color:var(--bad)">missing</span>':''}${f.pending.length?` <span class="tag ai">AI ${f.pending.length}</span>`:''}${f.queued?' <span class="tag">queued</span>':''}</td><td>${f.year||''}</td><td>${esc(f.director)}</td><td>${pgLink(f.primary_genre)}</td>${S.azCol?`<td>${azLink(f.aznude_status)}</td>`:''}<td>${countryLinks(f.country)}</td><td>${studioLinks(f.studio)}</td><td>${resLink(f.resolution)}</td><td>${f.runtime||''}</td><td>${f.rating||''}</td><td>${esc(f.mpaa)}</td><td>${f.watched?'✓':''}</td><td>${tagsHtml(f)}</td></tr>`).join('')+'</tbody></table>'}
 if(S.people.length||$('f_in').value=='people')c.insertAdjacentHTML('afterbegin',peopleSection())
}
function sortBy(k){if($('sort').value==k)S.order=S.order=='asc'?'desc':'asc';else{$('sort').value=k;S.order='asc'}$('ord').textContent=S.order=='asc'?'↑':'↓';load()}
$('content').addEventListener('click',e=>{const el=e.target.closest('[data-id]');if(!el)return;const id=+el.dataset.id;
 if(e.ctrlKey||e.metaKey||e.shiftKey||e.target.type=='checkbox'){
  if(e.shiftKey&&S.lastClick!=null){const ids=S.films.map(f=>f.id),a=ids.indexOf(S.lastClick),b=ids.indexOf(id);ids.slice(Math.min(a,b),Math.max(a,b)+1).forEach(i=>S.sel.add(i))}
  else S.sel.has(id)?S.sel.delete(id):S.sel.add(id);S.lastClick=id;render()}else openFilm(id)});
$('content').addEventListener('contextmenu',e=>{const el=e.target.closest('[data-id]');if(!el)return;e.preventDefault();const id=+el.dataset.id;
 const ids=S.sel.has(id)?[...S.sel]:[id];const m=$('ctx');
 m.innerHTML=`<div onclick="queueFilms([${ids}])">✨ Smart tagging (AI)${ids.length>1?' ('+ids.length+')':''}</div><div onclick="startJob('/api/ai/start',{film_ids:[${ids}]})">⚡ Tag now with my AI${ids.length>1?' ('+ids.length+')':''}</div><div onclick="queueAZ([${ids}])">✨ AZNude Status${ids.length>1?' ('+ids.length+')':''}</div><div onclick="openFilm(${id})">Edit…</div>
 <div onclick="S.sel.has(${id})?S.sel.delete(${id}):S.sel.add(${id});render()">${S.sel.has(id)?'Deselect':'Select'}</div><div onclick="api('/api/bulk/update',{method:'POST',body:{film_ids:[${ids}],fields:{watched:1}}}).then(load)">Mark watched</div>
 <div onclick="navigator.clipboard.writeText(S.films.find(f=>f.id==${id}).files.map(x=>x.path).join('\\n'));toast('Path copied')">Copy file path</div>`;
 m.style.display='block';m.style.left=Math.min(e.clientX,innerWidth-240)+'px';m.style.top=Math.min(e.clientY,innerHeight-200)+'px'});
document.addEventListener('click',()=>$('ctx').style.display='none');
document.addEventListener('keydown',e=>{if(e.key=='Escape'){closeM();$('libPop').classList.remove('open')}});
const AZS=['Hardcore','Softcore','Not found'];
function azOpts(v){return `<option value="" ${v?'':'selected'}>Unchecked</option>`+AZS.map(s=>`<option ${s==v?'selected':''}>${s}</option>`).join('')}
function azLink(v){return v?`<a class=clink href="#" title="Show all films with AZNude Status ${esc(v)}" onclick="filterAZ('${esc(v)}');return false">${esc(v)}</a>`:''}
function azInfo(f){const d=f.aznude_checked?new Date(f.aznude_checked*1000).toLocaleDateString():'';
 return `<span class=muted style="font-size:.85em">${f.aznude_status?azLink(f.aznude_status):'Unchecked'}${d?' · checked '+esc(d):''}${f.aznude_url&&/^https?:\/\//i.test(f.aznude_url)?` · <a href="${esc(f.aznude_url)}" target=_blank rel="noopener noreferrer">AZNude page ↗</a>`:''}${f.aznude_queued?' · <span class=tag>queued</span>':''}${(f.edited_fields||'').includes('"aznude_status"')?' · set by hand':''}</span>${f.aznude_note?`<div class=muted style="font-size:.8em">${esc(f.aznude_note)}</div>`:''}`}
function filterAZ(v){S.keepFilm=true;closeM();S.keepFilm=false;FK.forEach(k=>{if(k!='in'&&k!='lib')$('f_'+k).value=''});$('q').value='';setLib('');renderMpaa();S.sel.clear();$('f_aznude').value=v;load()}
async function queueAZ(ids){const j=await api('/api/aznude/queue',{method:'POST',body:{film_ids:ids}});toast(`Queued ${ids.length} for AZNude Status check (AZNude queue: ${j.count})`);reload()}
async function queueFilms(ids){const j=await api('/api/queue',{method:'POST',body:{film_ids:ids}});toast(`Queued ${ids.length} for Smart tagging (AI) (queue: ${j.count})`);refreshMeta();reload()}
async function selectAll(){const j=await api('/api/films?'+params({ids_only:1}));j.ids.forEach(i=>S.sel.add(i));render()}
async function bulkTag(add){const name=$('bulkTag').value.trim();if(!name)return;
 await api('/api/bulk/tags',{method:'POST',body:{film_ids:[...S.sel],add:add?[{name,category:$('bulkCat').value||null}]:[],remove:add?[]:[name]}});
 toast(`${add?'Added':'Removed'} "${name}" ${add?'to':'from'} ${S.sel.size} films`);refreshMeta();reload()}
async function bulkMpaa(){const v=$('bulkMpaa').value,n=S.sel.size;if(!n)return;
 if(!confirm(v?`Set the MPAA rating of ${n} film${n==1?'':'s'} to "${v}"?`:`Clear the MPAA rating of ${n} film${n==1?'':'s'}?`))return;
 const j=await api('/api/bulk/mpaa',{method:'POST',body:{film_ids:[...S.sel],mpaa:v}});S.sel.clear();refreshMeta();
 toast(v?`Set MPAA rating to ${v} on ${j.updated} films`:`Cleared MPAA rating on ${j.updated} films`);reload()}
async function bulkRes(){const v=$('bulkRes').value,n=S.sel.size;if(!n)return;
 if(!confirm(v?`Set the resolution of ${n} film${n==1?'':'s'} to "${v}"?`:`Clear the resolution of ${n} film${n==1?'':'s'}?`))return;
 const j=await api('/api/bulk/resolution',{method:'POST',body:{film_ids:[...S.sel],resolution:v}});S.sel.clear();refreshMeta();
 toast(v?`Set resolution to ${v} on ${j.updated} films`:`Cleared resolution on ${j.updated} films`);reload()}
async function bulkStudio(){const v=$('bulkStudio').value.trim(),n=S.sel.size;if(!n)return;
 if(!confirm(v?`Set the studio of ${n} film${n==1?'':'s'} to "${v}"?`:`Clear the studio of ${n} film${n==1?'':'s'}?`))return;
 const j=await api('/api/bulk/studio',{method:'POST',body:{film_ids:[...S.sel],studio:v}});S.sel.clear();refreshMeta();
 toast(v?`Set studio to ${v} on ${j.updated} films`:`Cleared studio on ${j.updated} films`);reload()}
async function bulkWatched(v){await api('/api/bulk/update',{method:'POST',body:{film_ids:[...S.sel],fields:{watched:v}}});reload()}
async function bulkDelete(){if(!confirm(`Remove ${S.sel.size} films from the library? (Video files on disk are NOT touched.)`))return;
 await api('/api/bulk/delete',{method:'POST',body:{film_ids:[...S.sel]}});S.sel.clear();refreshMeta();reload()}
async function rmTag(fid,name){await api('/api/bulk/tags',{method:'POST',body:{film_ids:[fid],remove:[name]}});openFilm(fid);refreshMeta()}
async function refreshMeta(){loadPGenres();loadCountries();loadStudios();loadDecades();loadRes();loadSubs();
 const [tags,cats,st,ss]=await Promise.all([api('/api/tags'),api('/api/categories'),api('/api/settings'),api('/api/searches')]);S.tags=tags;S.cats=cats;
 $('taglist').innerHTML=[...tags].sort((x,y)=>x.name.localeCompare(y.name,undefined,{sensitivity:'base'})).map(t=>`<option value="${esc(t.name)}"></option>`).join('');
 $('bulkCat').innerHTML='<option value="">(category)</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join('');
 $('stats').textContent=`${st.films.toLocaleString()} films · ${tags.length} tags`;
 $('pendBtn').textContent=`AI review (${st.pending})`;$('queueBtn').textContent=`Queue (${st.queue})`;$('pendBtn').classList.toggle('pri',st.pending>0);
 let g={};tags.forEach(t=>(g[t.category||'Uncategorized']??=[]).push(t));
 S.tagGroups=g;renderTagCloud();
 $('saved').innerHTML=ss.map(s=>`<div class=ss><a onclick='applySearch(${JSON.stringify(s.query).replace(/'/g,"&#39;")})'>${esc(s.name)}</a><x style="cursor:pointer" onclick="api('/api/searches/${s.id}',{method:'DELETE'}).then(refreshMeta)">×</x></div>`).join('')||'none'}
const TC_KEY='ft.collapsedCats';
function tcCollapsed(){try{return new Set(JSON.parse(localStorage.getItem(TC_KEY)||'[]'))}catch(e){return new Set()}}
function tcSave(s){try{localStorage.setItem(TC_KEY,JSON.stringify([...s]))}catch(e){}}
function tcSelected(){const s=new Set();['all','any','none'].forEach(k=>{const el=$('f_'+k);if(el)el.value.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean).forEach(x=>s.add(x))});return s}
function toggleCat(c){const s=tcCollapsed();s.has(c)?s.delete(c):s.add(c);tcSave(s);renderTagCloud()}
function setAllCats(collapse){tcSave(collapse?new Set(Object.keys(S.tagGroups||{})):new Set());renderTagCloud()}
function renderTagCloud(){const g=S.tagGroups||{},col=tcCollapsed(),sel=tcSelected();
 const ctl=`<div class=muted style="font-size:11px;margin:2px 0"><a href="#" onclick="setAllCats(false);return false">Expand all</a> · <a href="#" onclick="setAllCats(true);return false">Collapse all</a></div>`;

function formVals(){const d={};['title','original_title','user_akas','year','runtime','director','rating','mpaa','watched','cast_','writers','producers','cinematographer','composer','country','studio','resolution','primary_genre','aznude_status','subtitles','plot','notes','storage','tmdb_id','poster','release_date','tpdb_id'].forEach(k=>{if($('e_'+k))d[k]=$('e_'+k).value});d.paths=$('e_paths').value.split('\n').map(s=>s.trim()).filter(Boolean);return d}
function tmdbIdOf(v){v=String(v||'').trim();const m=v.match(/themoviedb\.org\/(?:[a-z]{2}(?:-[A-Z]{2})?\/)?movie\/(\d+)/)||v.match(/^(\d+)$/);return m?m[1]:(v?null:'')}
function changedFields(d){const o=S.editOrig||{},n=v=>v==null?'':String(v).trim();
 return ['title','original_title','user_akas','year','runtime','director','rating','mpaa','watched','cast_','writers','producers','cinematographer','composer','country','studio','resolution','primary_genre','aznude_status','subtitles','plot','notes','storage','poster','release_date','tpdb_id'].filter(k=>$('e_'+k)&&n(d[k])!=n(k=='watched'?(o[k]?1:0):o[k]))}
async function saveWithTmdb(id,forceLoad){const d=formVals();const tid=tmdbIdOf(d.tmdb_id);
 if(tid===null){toast('That is not a TMDB id or themoviedb.org/movie/… link');return false}d.tmdb_id=tid;
 const newId=tid&&(forceLoad||String(tid)!=String(S.editOrig.tmdb_id??''));const keep=changedFields(d);
 const sv=await api('/api/films/'+id,{method:'PUT',body:d});if(sv.rename_note)toast(sv.rename_note);
 if(sv.tmdb_loaded){toast('Loaded details from TMDB'+(keep.length?' (kept your edits: '+keep.join(', ')+')':''));S.editOrig=sv;return true}
 if(sv.tmdb_error){toast('Saved, but TMDB: '+sv.tmdb_error);return true}
 if(newId){try{await api(`/api/films/${id}/tmdb`,{method:'POST',body:{tmdb_id:tid,keep}});toast('Loaded details from TMDB'+(keep.length?' (kept your edits: '+keep.join(', ')+')':''))}
  catch(e){openFilm(id);return false}}
 return true}
function tpStale(id){if(S.openId===id)return false;toast('That ThePornDB result belongs to a different scene, so nothing was changed. Reopen the scene and search again.');return true}
async function loadTpdb(id,auto){if(tpStale(id))return;if(auto&&(($('e_tpdb_id')||{}).value||'').trim()&&$('tpFind')){await findTpdb(id);$('tpFind').scrollIntoView({block:'nearest'});return}  // already matched: show choices, never auto-apply
 const g0=S.tpGen;const v=auto?'':($('e_tpdb_id')||{}).value||'';if(!auto&&!v.trim()){toast('Enter a ThePornDB scene id or paste a theporndb.net/scenes/… link first');return}
 const d=formVals();if(!await saveWithTmdb(id,false))return;try{await api(`/api/films/${id}/tpdb`,{method:'POST',body:{tpdb_id:v,keep:changedFields(d)}});toast('Loaded details from ThePornDB');reload();refreshMeta();if(S.openId===id&&S.tpGen===g0)openFilm(id)}catch(e){const m=(e&&(e.error||e.message))||'ThePornDB lookup failed';
 if(S.openId!==id||S.tpGen!==g0)return;if(auto&&/No ThePornDB match/.test(m)&&$('tpFind')){toast('No confident match. Pick one of the candidates below.');await findTpdb(id);$('tpFind').scrollIntoView({block:'nearest'})}else toast(m)}}
function tpCand(x,use){return `<div class=tpc>${x.thumb?`<img loading=lazy src="${esc(x.thumb)}" alt="">`:'<span class=nt></span>'}<div class=tx><div title="${esc(x.title||'')}">${x.current?'<span class="tag" style="color:var(--a)">current match</span> ':''}<b>${esc(x.title||'')}</b></div><div class=muted>${esc([x.studio,x.date,x.duration?Math.round(x.duration/60)+'m':''].filter(Boolean).join(' · '))}</div><div class=muted title="${esc((x.performers||[]).join(', '))}">${esc((x.performers||[]).join(', '))||'—'}</div><div class=muted title="${esc((x.why||[]).join(', '))}">${x.current?'Your scene is matched to this one now · ':`Score ${x.confident?'✓ ':''}${x.score} · `}<a href="${esc(x.url)}" target=_blank rel=noopener onclick="event.stopPropagation()">ThePornDB ↗</a></div></div><button onclick="${use}">Use</button></div>`}
async function findTpdb(id,q){if(S.openId!==id)return;const b=$('tpFind');if(!b)return;const g=S.tpGen;b.innerHTML='<p class=muted>Searching ThePornDB…</p>';let d;
 try{d=await api(`/api/films/${id}/tpdb/candidates?`+new URLSearchParams(q?{q}:{}))}catch(e){if(g===S.tpGen&&S.openId===id&&b.isConnected)b.innerHTML=`<p class=muted>${esc(e.message||String(e))}</p>`;return}
 if(g!==S.tpGen||S.openId!==id||!b.isConnected)return;
 b.innerHTML=`<div class=row style="gap:4px;margin:6px 0"><input id=tpQ value="${esc(q||d.query)}" style="flex:1" onkeydown="if(event.key=='Enter')findTpdb(${id},this.value)"><button class=sidebtn onclick="findTpdb(${id},$('tpQ').value)">Search</button></div>${d.review?'<p class=muted>Flagged for review by hand: images are not shown.</p>':''}`+
  (d.results.length?d.results.map(x=>tpCand(x,`if(!tpStale(${id})){$('e_tpdb_id').value='${x.id}';loadTpdb(${id})}`)).join(''):'<p class=muted>No candidates. Try editing the search text.</p>')}

 $('rnRes').textContent=`Renamed ${r.renamed} file(s)`+(r.errors.length?`, ${r.errors.length} error(s): `+r.errors.slice(0,3).map(e=>e.error).join('; '):'');$('rnList').innerHTML='';reload()}

 if(!q)out.push(row('','All libraries',null,'','<span class=ar></span>'));
 S.libs.forEach((l,i)=>{let subs=l.subfolders,open=S.libOpen.has(l.path);
  if(q){subs=subs.filter(s=>s.name.toLowerCase().includes(q));const rootHit=l.path.toLowerCase().includes(q);if(!subs.length&&!rootHit)return;open=subs.length>0}

async function savePerson(pid){const p=S.ppData.person,b={};PPF.forEach(([k])=>{const v=$('ppe_'+k).value;if(v!==ppVal(p,k))b[k]=v});

async function mergePerson(pid){const p=S.ppData.person,n=(prompt('Merge which person into '+p.name+'? Type their name:')||'').trim();if(!n)return;
 let r;try{r=await api('/api/people/search?'+new URLSearchParams({q:n,limit:8}))}catch(e){toast(e.message||String(e));return}
 const c=(r.people||[]).filter(x=>x.pid!==pid),hit=c.find(x=>x.name.toLowerCase()==n.toLowerCase())||c[0];const other=hit?hit.name:n;
 if(!confirm(`Merge "${other}" into "${p.name}"?\n\n"${other}" becomes an alias of ${p.name}. Their credits and scenes are shown here and searches for either name find both. Nothing in your files or cast lists is changed, and the merge can be undone.`))return;
 try{await api('/api/person/'+pid+'/merge',{method:'POST',body:{other:hit&&hit.pid?hit.pid:other}})}catch(e){toast(e.message||String(e));return}toast('Merged '+other+' into '+p.name);showPerson(pid,{keep:true,nohist:true})}

function ppVal(p,k){return k=='aliases'?(p.aliases||[]).join(', '):k=='links'?Object.entries(p.links||{}).map(([a,b])=>a+': '+b).join('\n'):(p[k]||'')}

// Back to top: tracks whichever container scrolls (#content library/person pages, #modal, any long panel)
(function(){const b=document.getElementById('totop');let el=null;
 const upd=()=>{const on=!!el&&el.scrollTop>600&&el.getClientRects().length>0;b.classList.toggle('on',on)};
 document.addEventListener('scroll',e=>{const t=e.target===document?document.scrollingElement:e.target;if(!t||t.scrollHeight<=t.clientHeight)return;
  if(t.scrollTop>600||t===el){el=t;upd()}},true);
 b.addEventListener('click',()=>{if(el)el.scrollTo({top:0,behavior:'smooth'})});
 setInterval(()=>{if(el&&(!document.contains(el)||!el.getClientRects().length)){el=null}upd()},700)})();
