<script>
const S={view:localStorage.view||'grid',order:'asc',films:[],total:0,sel:new Set(),tags:[],cats:[],busy:false,lastClick:null};
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(u,o={}){if(o.body&&!(o.body instanceof FormData)){o.body=JSON.stringify(o.body);o.headers={'Content-Type':'application/json'}}
 const r=await fetch(u,o);ftBuild(r.headers.get('X-FT-Build'));const j=await r.json().catch(()=>({}));if(!r.ok){toast(j.error||r.statusText);throw j}return j}
/* The server was updated while this tab stayed open: offer a reload (old page code can't read new answers correctly). */
function ftBuild(b){if(!b)return;if(!window.FT_BUILD){window.FT_BUILD=b;return}if(b==window.FT_BUILD||window.FT_NOTIFIED==b)return;window.FT_NOTIFIED=b;const d=document.createElement('div');d.id='ftReload';
 d.style.cssText='position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:9999;background:#1b1e23;border:1px solid #5b9cff;color:#e6e8eb;padding:8px 12px;border-radius:8px;box-shadow:0 4px 18px #0008;font-size:13px';
 d.innerHTML='Film Tagger was updated. <button class=pri onclick="location.reload()" style="margin-left:8px">Reload</button> <button onclick="this.parentNode.remove()" style="margin-left:4px">Later</button>';document.body.appendChild(d)}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3500)}
const FK=['all','any','none','year_min','year_max','rating_min','rating_max','runtime_min','runtime_max','watched','special','mpaa','lib','in','person','prole','country','studio','decade','res','pgenre','aznude','subs','month','cocredit','pin','ids'];
const INPH={'':'Search everything…',people:'Search people (actors, directors, writers…)…',studios:'Filter studios by name or country…',title:'Search titles (incl. original/alternative)…',plot:'Search plots…',cast:'Search cast…',director:'Search directors…',notes:'Search notes…',tags:'Search tag names…',path:'Search file paths…',country:'Search countries…',studio:'Search studios…',resolution:'Search resolutions (e.g. 1080p)…',subtitles:'Search subtitles (e.g. English, SRT)…'};
function setIn(v){$('f_in').value=v||'';localStorage.searchIn=$('f_in').value;$('q').placeholder=INPH[$('f_in').value]}
const RESL=['SD','480p','576p','720p','1080p','1440p','4K'];
const MPAA=['G','PG','PG-13','R','NC-17','X','NR','Unrated','TV-MA','(none)'];
function query(){const q={q:$('q').value};FK.forEach(k=>q[k]=$('f_'+k).value);return q}
function params(extra={}){const q=query(),p=new URLSearchParams();for(const k in q)if(q[k]&&k!='special')p.set(k,q[k]);if(q.special)p.set(q.special,1);
 p.set('sort',$('sort').value);p.set('order',S.order);for(const k in extra)p.set(k,extra[k]);return p}
let lt;function debLoad(){clearTimeout(lt);lt=setTimeout(load,250)}
function navState(){return {...query(),sort:$('sort').value,order:S.order}}
function snap(){const c=history.state;if(c)history.replaceState({...c,scroll:$('content').scrollTop,n:S.films.length},'')}
function histSave(){if(S.restoring)return;const st=navState(),cur=history.state;if(!cur){history.replaceState({...st,film:null},'');return}
 const base={...cur};delete base.film;delete base.scroll;delete base.n;delete base.page;if(JSON.stringify(st)==JSON.stringify(base)&&!cur.film&&!cur.page)return;
 const onlyQ=!cur.film&&!cur.page&&Object.keys(st).every(k=>k=='q'||st[k]==base[k]);if(onlyQ){history.replaceState({...st,film:null},'');return}
 snap();history.pushState({...st,film:null},'')}
function histFilm(id){if(S.restoring)return;const c=history.state||navState();if(c.film==id)return;snap();history.pushState({...navState(),film:id,page:S.page||null,...(S.page=='dash'?{dscope:DSH.scope||'',ex:DSH.ex||null}:{}),...(String(S.page||'').startsWith('studio:')?{slib:S.stLib||''}:{})},'')}
window.addEventListener('popstate',async e=>{const q=e.state;if(!q)return;S.restoring=true;try{FK.forEach(k=>{if(k=='lib')setLib(q.lib||'');else if(k=='in')setIn(q.in||'');else $('f_'+k).value=q[k]||''});$('q').value=q.q||'';$('sort').value=q.sort||'title';S.order=q.order||'asc';$('ord').textContent=S.order=='asc'?'↑':'↓';renderMpaa();
 if(q.page=='dash'){await showDash({nohist:true,scope:q.dscope||'',ex:q.ex||null})}
 else if(q.page&&String(q.page).startsWith('co:')){await showCo(String(q.page).slice(3).split(',').map(Number),{nohist:true});$('content').scrollTop=q.scroll||0}
 else if(q.page&&String(q.page).startsWith('person:')){await showPerson(+String(q.page).slice(7),{nohist:true});$('content').scrollTop=q.scroll||0}
 else if(q.page&&String(q.page).startsWith('studio:')){await showStudio(String(q.page).slice(7),{nohist:true,lib:q.slib||''});$('content').scrollTop=q.scroll||0}
 else if(q.in=='studios'){S.page=null;dashNav(false);await stList();$('content').scrollTop=q.scroll||0}
 else{S.page=null;const j=await api('/api/films?'+params({limit:Math.max(300,q.n||0),offset:0}));S.films=j.films;S.total=j.total;await searchPeople();render();personHeader();$('content').scrollTop=q.scroll||0}
 if(q.film)await openFilm(q.film);else closeM()}finally{S.restoring=false}});
async function load(keep){keep=keep===true;if(S.tagGroups)renderTagCloud();if(($('f_lib').value||'')!==(S.tagScopeLib||''))loadTagScope().then(()=>{if(S.tagGroups)renderTagCloud()});if(keep&&S.page)return S.page=="dash"?showDash({keep:true,nohist:true}):String(S.page).startsWith("co:")?showCo(CO.ids,{keep:true,nohist:true}):String(S.page).startsWith("studio:")?showStudio(String(S.page).slice(7),{keep:true,nohist:true,lib:S.stLib||''}):showPerson(S.pageId,{keep:true,nohist:true});S.page=null;dashNav(false);if(!keep)histSave();if($('f_in').value=='studios')return stList(keep);const st=$('content').scrollTop;const j=$('f_in').value=='people'?{films:[],total:0}:await api('/api/films?'+params({limit:keep?Math.max(300,S.films.length):300,offset:0}));await searchPeople();S.films=j.films;S.total=j.total;render();$('content').scrollTop=keep?st:0;personHeader()}
function reload(){return load(true)}
const ROLES={director:['director','Director'],cast:['actor','Cast'],writer:['writer','Writers'],producer:['producer','Producers'],cinematographer:['cinematographer','Cinematography'],composer:['composer','Music']};
const PF=[['director','director'],['cast_','cast'],['writers','writer'],['producers','producer'],['cinematographer','cinematographer'],['composer','composer']];
const jsq=s=>esc(String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"));
const PPI='<svg width=13 height=13 viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2 stroke-linecap=round stroke-linejoin=round><circle cx=12 cy=8 r=4 /><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>';
function ppIc(name){return name?`<a class=pp-ic href="#" onclick="event.stopPropagation();event.preventDefault();openPersonByName('${jsq(name)}')" title="Open ${esc(name)}'s page">${PPI}</a>`:''}  // the name keeps its own action; the icon opens the person page
function dirNames(v){return String(v||'').split(',').map(x=>x.trim()).filter(Boolean).map(n=>`<span class=pp-nm>${esc(n)}${ppIc(n)}</span>`).join(', ')}  // JS-escape first: the attribute decodes &#39; back to a quote
async function personHeader(){const h=$('personHdr'),name=$('f_person').value,role=$('f_prole').value,co=$('f_cocredit').value;
 const pin=$('f_pin').value;
 if(pin&&!name&&!co){let p;try{p=await api('/api/people/'+pin+'/insights')}catch(e){return}if($('f_pin').value!==pin)return;
  h.innerHTML=`<b>${esc(p.name)}</b> · ${S.total==1?'1 title':dN(S.total)+' titles'} in your library · <a href="#" onclick="showPerson(${+pin});return false">Back to their page</a> · <a href="#" onclick="$('f_pin').value='';load();return false">✕ clear</a>`;h.style.display='';return}
 const fids=$('f_ids').value;
 if(fids&&!name&&!co&&!pin){h.innerHTML=`${S.total==1?'1 title':dN(S.total)+' titles'} from your Ask a question chart · <a href="#" onclick="acBack();return false">Back to the answer</a> · <a href="#" onclick="$('f_ids').value='';load();return false">✕ clear</a>`;h.style.display='';return}
 if(co&&!name){let p;try{p=await api('/api/people/cocredit?lite=1&ids='+encodeURIComponent(co))}catch(e){return}if($('f_cocredit').value!==co||$('f_person').value)return;
  h.innerHTML=`Credited together: <b>${p.people.map(x=>esc(x.name)).join(' &amp; ')}</b> · ${S.total==1?'1 title':dN(S.total)+' titles'} in your library · <a href="#" onclick="showCo([${co}]);return false">Back to their page</a> · <a href="#" onclick="$('f_cocredit').value='';load();return false">✕ clear</a>`;h.style.display='';return}
 const stf=$('f_studio').value.trim();
 if(stf&&!name&&!co&&!pin&&!fids){const s1=stf.split(',').map(x=>x.trim()).filter(Boolean);h.innerHTML=`Studio: <b>${s1.map(esc).join(' + ')}</b> · ${S.total==1?'1 title':dN(S.total)+' titles'} · ${s1.map(x=>`<a href="#" onclick="showStudio('${jsq(x)}');return false">Open ${s1.length>1?esc(x)+"'s":'the'} studio page</a>`).join(' · ')} · <a href="#" onclick="$('f_studio').value='';load();return false">✕ clear</a>`;h.style.display='';return}
 if(!name){h.style.display='none';h.innerHTML='';return}
 let p;try{p=await api('/api/people?'+new URLSearchParams({name,role}))}catch(e){return}
 if($('f_person').value!==name||$('f_prole').value!==role)return;
 const n=p.total,fs=n==1?'film':'films',what=role?`as ${ROLES[role][0]}`:'in any role';
 const others=Object.entries(p.counts).filter(([r,c])=>c&&r!==role).map(([r,c])=>`<a href="#" onclick="filterPerson('${jsq(name)}','${r}');return false">${c} as ${ROLES[r][0]}</a>`);
 if(role)others.push(`<a href="#" onclick="filterPerson('${jsq(name)}','');return false">any role</a>`);
 h.innerHTML=`<b style="font-size:1.15em">${esc(p.name)}: ${n} ${fs} ${what}</b>${S.total!=n?` <span class=muted>(${S.total} shown with other filters)</span>`:''}${others.length?' <span class=muted>· also: '+others.join(' · ')+'</span>':''} <span style="margin-left:12px">Sort by <select onchange="$('sort').value=this.value;load()">${$('sort').innerHTML.replace(/Sort: /g,'').replace(`value="${$('sort').value}"`,`value="${$('sort').value}" selected`)}</select> <button onclick="S.order=S.order=='asc'?'desc':'asc';$('ord').textContent=S.order=='asc'?'↑':'↓';load()" title="Reverse order">${S.order=='asc'?'↑':'↓'}</button></span> <button style="margin-left:8px" onclick="filterPerson('')" title="Clear person filter">× Clear</button>`;h.style.display='block'}
function filterPerson(name,role=''){if(name)return openPersonByName(name);S.keepFilm=true;closeM();S.keepFilm=false;FK.forEach(k=>{if(k!='in'&&k!='lib')$('f_'+k).value=''});$('q').value='';renderMpaa();S.sel.clear();
 $('f_person').value=name||'';$('f_prole').value=name?role:'';load()}
const MPAA_ALL=['G','PG','PG-13','R','NC-17','X','NR','Unrated','TV-Y','TV-Y7','TV-G','TV-PG','TV-14','TV-MA'];
function mpaaOpts(v){v=v||'';const l=['',...MPAA_ALL];if(v&&!l.includes(v))l.push(v);return l.map(m=>`<option value="${esc(m)}" ${m==v?'selected':''}>${m?esc(m):'—'}</option>`).join('')}
function peopleField(f,k,role){const v=f[k]||'',names=v.split(',').map(s=>s.trim()).filter(Boolean);
 return `<div><label>${ROLES[role][1]} <a href="#" title="Edit names" style="text-decoration:none" onclick="togglePF('${k}');return false">✏️</a></label>
 <div id=pv_${k} class=plinks style="min-height:1.6em">${names.map(n=>`<a href="#" title="Open ${esc(n)}'s page" onclick="filterPerson('${jsq(n)}','${role}');return false">${esc(n)}</a>`).join(', ')||'<span class=muted>—</span>'}</div>
 <div style="position:relative"><input id=e_${k} value="${esc(v)}" style="display:none" autocomplete=off placeholder="Names, comma-separated" oninput="pAC(this)" onblur="setTimeout(()=>pACclose(),200)"><div id=pac_${k} class=pac></div></div></div>`}
async function pAC(el){const k=el.id.slice(2),box=$('pac_'+k),tok=el.value.split(',').pop().trim();if(tok.length<2){box.style.display='none';return}
 let j;try{j=await api('/api/people/search?'+new URLSearchParams({q:tok,limit:8}))}catch(e){return}if(el.value.split(',').pop().trim()!==tok)return;

 const img=$('pcImg'),fr=$('pcFr'),z=$('pcZoom');let s0=1,s=1,tx=0,ty=0,W=0,H=0;
 const clamp=()=>{tx=Math.min(0,Math.max(PC_W-W*s,tx));ty=Math.min(0,Math.max(PC_H-H*s,ty));img.style.transform=`translate(${tx}px,${ty}px) scale(${s})`};

function dTime(rows,o){/* rows:[{k,label,films,scenes}] -> SVG bar (stacked) or line chart; o:{mode,click(k)->js,title(r)} */
 const W=680,H=250,L=40,T=14,B=30,n=Math.max(1,rows.length),pw=(W-L-8)/n,y0=H-B,mx=Math.max(1,...rows.map(r=>r.films+(o.line?0:r.scenes)),...(o.line?rows.map(r=>r.scenes):[0]));
 const nice=v=>{const p=Math.pow(10,Math.floor(Math.log10(v))),m=v/p;return (m<=1?1:m<=2?2:m<=5?5:10)*p},top=Math.max(4,nice(mx)),sc=(y0-T)/top;

 for(let i=0;i<=4;i++){const v=top*i/4,y=y0-v*sc;g+=`<line x1=${L} x2=${W} y1=${y.toFixed(1)} y2=${y.toFixed(1)} stroke="#2a2f37"></line><text x=${L-6} y=${(y+4).toFixed(1)} text-anchor=end>${dN(Math.round(v))}</text>`}

 rows.forEach((r,i)=>{const x=L+i*pw,cx=x+pw/2,tip=esc(o.title(r)),js=o.click?o.click(r):'';
  const lab=(i%step==0||n<=24)?`<text x=${cx.toFixed(1)} y=${H-12} text-anchor=middle>${esc(r.label)}</text>`:'';
  if(!o.line){const pad=Math.min(9,pw*.18),w=Math.max(1,pw-2*pad),hf=r.films*sc,hs=r.scenes*sc;
   body+=`<g class=${js?'dsh-bar':'dsh-nb'}${js?` onclick="${js}"`:''}><title>${tip}</title><rect x=${x.toFixed(1)} y=0 width=${pw.toFixed(1)} height=${H} fill=transparent></rect>${r.films?`<rect x=${(x+pad).toFixed(1)} y=${(y0-hf).toFixed(1)} width=${w.toFixed(1)} height=${Math.max(hf,1).toFixed(1)} rx=${Math.min(3,w/3).toFixed(1)} fill="#5b9cff"></rect>`:''}${r.scenes?`<rect x=${(x+pad).toFixed(1)} y=${(y0-hf-hs).toFixed(1)} width=${w.toFixed(1)} height=${Math.max(hs,1).toFixed(1)} rx=${Math.min(3,w/3).toFixed(1)} fill="${o.c2||'#c58bff'}"></rect>`:''}${n<=16&&(r.films+r.scenes)?`<text x=${cx.toFixed(1)} y=${(y0-hf-hs-6).toFixed(1)} text-anchor=middle class=v>${dN(r.films+r.scenes)}</text>`:''}${lab}</g>`}
  else{const yf=y0-r.films*sc,ys=y0-r.scenes*sc;lf+=`${i?'L':'M'}${cx.toFixed(1)} ${yf.toFixed(1)}`;ls+=`${i?'L':'M'}${cx.toFixed(1)} ${ys.toFixed(1)}`;
   body+=`<g class=${js?'dsh-bar dsh-pt':'dsh-nb'}${js?` onclick="${js}"`:''}><title>${tip}</title><rect x=${x.toFixed(1)} y=0 width=${pw.toFixed(1)} height=${H} fill=transparent></rect>${n<=60||r.films?`<circle cx=${cx.toFixed(1)} cy=${yf.toFixed(1)} r=${n>60?2:3.5} fill="#5b9cff"></circle>`:''}${hasS&&(n<=60||r.scenes)?`<circle cx=${cx.toFixed(1)} cy=${ys.toFixed(1)} r=${n>60?2:3.5} fill="${o.c2||'#c58bff'}"></circle>`:''}${lab}</g>`}});
 const lines=o.line?`<path d="${lf}" fill=none stroke="#5b9cff" stroke-width=2 stroke-linejoin=round></path>${hasS?`<path d="${ls}" fill=none stroke="${o.c2||'#c58bff'}" stroke-width=2 stroke-linejoin=round></path>`:''}`:'';
 return `<svg viewBox="0 0 ${W} ${H}" width=100% height=${H} preserveAspectRatio="xMidYMid meet"><line x1=${L} x2=${W} y1=${y0+.5} y2=${y0+.5} stroke="#333944"></line>${g}${lines}${body}</svg>`}
function dLine(rows,o){/* single % series: rows [{k,label,v,tip}] */
 const W=680,H=200,L=40,T=14,B=30,n=Math.max(1,rows.length),pw=(W-L-8)/n,y0=H-B,mx=Math.max(1,...rows.map(r=>r.v)),top=mx>50?100:mx>20?50:mx>10?20:mx>5?10:5,sc=(y0-T)/top;let g='',d='',b='';

 rows.forEach((r,i)=>{const cx=L+i*pw+pw/2,y=y0-r.v*sc,js=o.click?o.click(r):'';d+=`${i?'L':'M'}${cx.toFixed(1)} ${y.toFixed(1)}`;
